<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comebaco: Pájaros Lanzallamas 🐢 vs 🐦🔥</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;700&display=swap');
  
  body {
    font-family: 'Inter', sans-serif;
    background-color: #0f172a;
    color: #f8fafc;
  }
  
  .arcade-font {
    font-family: 'Press Start 2P', monospace;
  }

  canvas {
    image-rendering: pixelated;
    box-shadow: 0 0 30px rgba(249, 115, 22, 0.4);
  }
</style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 select-none">

  <main class="w-full max-w-xl bg-slate-900 border-2 border-slate-700 rounded-2xl p-6 shadow-2xl flex flex-col items-center gap-5">
    
    <!-- Título -->
    <div class="text-center">
      <h1 class="arcade-font text-lg sm:text-xl text-amber-500 tracking-wider mb-2">COMEBACO: ATAQUE FUEGO</h1>
      <p class="text-xs text-slate-400">¡Los pájaros le lanzan antorchas teledirigidas a Baco!</p>
    </div>

    <!-- Panel de Estado -->
    <div class="w-full grid grid-cols-3 gap-2 px-4 py-2 bg-slate-950 rounded-xl border border-slate-800 arcade-font text-[10px] text-center">
      <div class="text-sky-400">PUNTOS: <span id="score-val" class="text-white">0</span></div>
      <div class="text-emerald-400">NIVEL: <span id="level-val" class="text-white">1</span></div>
      <div class="text-amber-400">RÉCORD: <span id="record-val" class="text-white">0</span></div>
    </div>

    <!-- Canvas del Juego -->
    <div class="relative w-full flex justify-center">
      <canvas id="gameCanvas" width="480" height="280" class="w-full max-w-[480px] bg-slate-950 rounded-xl border border-slate-800 cursor-pointer"></canvas>
    </div>

    <!-- Controles -->
    <div class="text-center text-xs text-slate-400 bg-slate-950/60 p-3 rounded-xl border border-slate-800/80 w-full flex flex-col gap-1">
      <p class="font-bold text-amber-400">🔥 ¡Antorchas Perseguidoras!</p>
      <p>Cambiá de carril con las flechas <span class="text-white font-mono bg-slate-800 px-1.5 py-0.5 rounded">↑</span> <span class="text-white font-mono bg-slate-800 px-1.5 py-0.5 rounded">↓</span> o tocando arriba/abajo cuando te disparen.</p>
    </div>

  </main>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreVal = document.getElementById('score-val');
    const levelVal = document.getElementById('level-val');
    const recordVal = document.getElementById('record-val');

    let score = 0;
    let level = 1;
    let highScore = localStorage.getItem('comebaco_homing_highscore') || 0;
    recordVal.textContent = highScore;

    let isPlaying = false;
    let isGameOver = false;

    // Posiciones de los 3 carriles
    const lanes = [75, 140, 205];
    
    // Objeto Baco
    const baco = {
      laneIndex: 1,
      x: 60,
      targetY: lanes[1],
      currentY: lanes[1]
    };

    let birds = [];
    let torches = []; // Antorchas lanzadas
    let frameCount = 0;
    let baseSpeed = 3;

    // Controles por teclado
    window.addEventListener('keydown', (e) => {
      if (!isPlaying && !isGameOver) {
        if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'ArrowDown') startGame();
        return;
      }

      if (isPlaying) {
        if (e.code === 'ArrowUp') {
          if (baco.laneIndex > 0) baco.laneIndex--;
        }
        if (e.code === 'ArrowDown') {
          if (baco.laneIndex < lanes.length - 1) baco.laneIndex++;
        }
      }

      if (isGameOver && (e.code === 'Space' || e.code === 'KeyR')) {
        resetGame();
      }
    });

    // Controles táctiles / clic
    canvas.onclick = (e) => {
      if (!isPlaying && !isGameOver) {
        startGame();
        return;
      }
      if (isGameOver) {
        resetGame();
        return;
      }

      const rect = canvas.getBoundingClientRect();
      const clickY = e.clientY - rect.top;
      
      if (clickY < canvas.height / 2) {
        if (baco.laneIndex > 0) baco.laneIndex--;
      } else {
        if (baco.laneIndex < lanes.length - 1) baco.laneIndex++;
      }
    };

    function startGame() {
      isPlaying = true;
      isGameOver = false;
      score = 0;
      level = 1;
      baseSpeed = 3;
      birds = [];
      torches = [];
      baco.laneIndex = 1;
      loop();
    }

    function resetGame() {
      startGame();
    }

    function loop() {
      if (!isPlaying || isGameOver) return;

      frameCount++;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // --- Dibujar Carriles ---
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(0, 108); ctx.lineTo(canvas.width, 108);
      ctx.moveTo(0, 172); ctx.lineTo(canvas.width, 172);
      ctx.stroke();
      ctx.setLineDash([]);

      // Movimiento suave de Baco entre carriles
      baco.targetY = lanes[baco.laneIndex];
      baco.currentY += (baco.targetY - baco.currentY) * 0.25;

      // --- Dibujar Baco 🐢 ---
      ctx.font = '26px monospace';
      ctx.fillText('🐢', baco.x - 12, baco.currentY + 9);

      // --- Generación de Pájaros 🐦 ---
      let spawnInterval = Math.max(35, 75 - (level * 6));
      if (frameCount % spawnInterval === 0) {
        let randomLane = Math.floor(Math.random() * lanes.length);
        birds.push({
          x: canvas.width + 30,
          laneIndex: randomLane,
          y: lanes[randomLane],
          speed: baseSpeed + (level * 0.4),
          hasShot: false // Marca para saber si ya lanzó su antorcha
        });
      }

      // --- Lógica de Pájaros ---
      for (let i = birds.length - 1; i >= 0; i--) {
        let bird = birds[i];
        bird.x -= bird.speed;
        ctx.fillText('🐦', bird.x - 12, bird.y + 9);

        // Disparo de antorchas teledirigidas hacia Baco cuando el pájaro está cerca
        if (!bird.hasShot && bird.x < canvas.width - 80 && bird.x > 200) {
          bird.hasShot = true;
          
          // Calcular dirección hacia Baco en el momento del disparo
          let dx = baco.x - bird.x;
          let dy = baco.currentY - bird.y;
          let angle = Math.atan2(dy, dx);
          let torchSpeed = 4.5 + (level * 0.3);

          torches.push({
            x: bird.x,
            y: bird.y,
            vx: Math.cos(angle) * torchSpeed,
            vy: Math.sin(angle) * torchSpeed
          });
        }

        // Colisión directa con el pájaro
        if (baco.laneIndex === bird.laneIndex && Math.abs(baco.x - bird.x) < 20) {
          endGame();
        }

        if (bird.x < -30) {
          birds.splice(i, 1);
          score += 10;
          scoreVal.textContent = score;

          let newLevel = Math.floor(score / 80) + 1;
          if (newLevel > level) {
            level = newLevel;
            levelVal.textContent = level;
          }
        }
      }

      // --- Lógica de Antorchas Teledirigidas 🔥 ---
      for (let j = torches.length - 1; j >= 0; j--) {
        let torch = torches[j];
        torch.x += torch.vx;
        torch.y += torch.vy;

        ctx.fillText('🔥', torch.x - 10, torch.y + 8);

        // Colisión de antorcha con Baco
        let dist = Math.hypot(baco.x - torch.x, baco.currentY - torch.y);
        if (dist < 22) {
          endGame();
        }

        // Eliminar si sale de la pantalla
        if (torch.x < -20 || torch.y < -20 || torch.y > canvas.height + 20) {
          torches.splice(j, 1);
        }
      }

      if (!isGameOver) {
        requestAnimationFrame(loop);
      } else {
        drawGameOverScreen();
      }
    }

    function endGame() {
      isGameOver = true;
      isPlaying = false;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('comebaco_homing_highscore', highScore);
        recordVal.textContent = highScore;
      }
    }

    function drawStartScreen() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#f97316';
      ctx.font = 'bold 15px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('¡PÁJAROS CON ANTORCHAS!', canvas.width / 2, 85);
      
      ctx.fillStyle = '#f8fafc';
      ctx.font = '11px monospace';
      ctx.fillText('¡Los pájaros le disparan fuego a Baco!', canvas.width / 2, 125);
      ctx.fillText('Cambiá de carril para esquivar los ataques', canvas.width / 2, 150);

      ctx.fillStyle = '#38bdf8';
      ctx.font = '10px monospace';
      ctx.fillText('TOCÁ O PULSÁ ESPACIO PARA JUGAR', canvas.width / 2, 215);
      ctx.textAlign = 'left';
    }

    function drawGameOverScreen() {
      ctx.fillStyle = 'rgba(2, 6, 23, 0.88)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.textAlign = 'center';
      ctx.fillStyle = '#ef4444';
      ctx.font = 'bold 15px monospace';
      ctx.fillText('¡UNA ANTORCHA ALCANZÓ A BACO!', canvas.width / 2, 90);

      ctx.fillStyle = '#f8fafc';
      ctx.font = '12px monospace';
      ctx.fillText(`Puntuación: ${score} | Nivel alcanzado: ${level}`, canvas.width / 2, 130);

      ctx.fillStyle = '#38bdf8';
      ctx.font = '11px monospace';
      ctx.fillText('Hacé clic o presioná ESPACIO para reintentar', canvas.width / 2, 180);
      ctx.textAlign = 'left';
    }

    drawStartScreen();
  </script>
</body>
</html>
