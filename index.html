<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comebaco: El Desafío de los Carriles 🐢 vs 🐦</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;700&display=swap');
  
  body {
    font-family: 'Inter', sans-serif;
    background-color: #0f172a;
    color: #f8fafc;
  }
  
  .arcade-font {
    font-family: 'Press Start 2P', monospace;
  }

  canvas {
    image-rendering: pixelated;
    box-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
  }
</style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 select-none">

  <main class="w-full max-w-xl bg-slate-900 border-2 border-slate-700 rounded-2xl p-6 shadow-2xl flex flex-col items-center gap-5">
    
    <!-- Título -->
    <div class="text-center">
      <h1 class="arcade-font text-xl sm:text-2xl text-sky-400 tracking-wider mb-2">COMEBACO: CARRILES</h1>
      <p class="text-xs text-slate-400">¡Ayudá a Baco a cruzar y esquivar los pájaros enojados!</p>
    </div>

    <!-- Panel de Estado (Puntuación, Nivel y Récord) -->
    <div class="w-full grid grid-cols-3 gap-2 px-4 py-2 bg-slate-950 rounded-xl border border-slate-800 arcade-font text-[10px] text-center">
      <div class="text-sky-400">PUNTOS: <span id="score-val" class="text-white">0</span></div>
      <div class="text-emerald-400">NIVEL: <span id="level-val" class="text-white">1</span></div>
      <div class="text-amber-400">RÉCORD: <span id="record-val" class="text-white">0</span></div>
    </div>

    <!-- Canvas del Juego -->
    <div class="relative w-full flex justify-center">
      <canvas id="gameCanvas" width="480" height="280" class="w-full max-w-[480px] bg-slate-950 rounded-xl border border-slate-800 cursor-pointer"></canvas>
    </div>

    <!-- Controles -->
    <div class="text-center text-xs text-slate-400 bg-slate-950/60 p-3 rounded-xl border border-slate-800/80 w-full flex flex-col gap-1">
      <p class="font-bold text-sky-300">🎮 Controles:</p>
      <p>Usá las flechas <span class="text-white font-mono bg-slate-800 px-1.5 py-0.5 rounded">↑</span> <span class="text-white font-mono bg-slate-800 px-1.5 py-0.5 rounded">↓</span> o tocá la pantalla arriba/abajo para cambiar de carril.</p>
    </div>

  </main>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreVal = document.getElementById('score-val');
    const levelVal = document.getElementById('level-val');
    const recordVal = document.getElementById('record-val');

    let score = 0;
    let level = 1;
    let highScore = localStorage.getItem('comebaco_lanes_highscore') || 0;
    recordVal.textContent = highScore;

    let isPlaying = false;
    let isGameOver = false;

    // Posiciones de los 3 carriles (Y central de cada carril)
    const lanes = [75, 140, 205];
    
    // Objeto Baco
    const baco = {
      laneIndex: 1, // Empieza en el carril del medio
      x: 60,
      radius: 16,
      targetY: lanes[1],
      currentY: lanes[1]
    };

    let birds = [];
    let frameCount = 0;
    let baseSpeed = 3;

    // Control de movimientos por teclado
    window.addEventListener('keydown', (e) => {
      if (!isPlaying && !isGameOver) {
        if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'ArrowDown') startGame();
        return;
      }

      if (isPlaying) {
        if (e.code === 'ArrowUp') {
          if (baco.laneIndex > 0) baco.laneIndex--;
        }
        if (e.code === 'ArrowDown') {
          if (baco.laneIndex < lanes.length - 1) baco.laneIndex++;
        }
      }

      if (isGameOver && (e.code === 'Space' || e.code === 'KeyR')) {
        resetGame();
      }
    });

    // Control táctil o por clic (Dividir pantalla arriba/abajo)
    canvas.onclick = (e) => {
      if (!isPlaying && !isGameOver) {
        startGame();
        return;
      }
      if (isGameOver) {
        resetGame();
        return;
      }

      const rect = canvas.getBoundingClientRect();
      const clickY = e.clientY - rect.top;
      
      // Si hace clic en la mitad superior o inferior del canvas
      if (clickY < canvas.height / 2) {
        if (baco.laneIndex > 0) baco.laneIndex--;
      } else {
        if (baco.laneIndex < lanes.length - 1) baco.laneIndex++;
      }
    };

    function startGame() {
      isPlaying = true;
      isGameOver = false;
      score = 0;
      level = 1;
      baseSpeed = 3;
      birds = [];
      baco.laneIndex = 1;
      loop();
    }

    function resetGame() {
      startGame();
    }

    function loop() {
      if (!isPlaying || isGameOver) return;

      frameCount++;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // --- Dibujar los 3 Carriles (Líneas de la ruta/balcón) ---
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 6]);
      
      // Líneas divisorias
      ctx.beginPath();
      ctx.moveTo(0, 108); ctx.lineTo(canvas.width, 108);
      ctx.moveTo(0, 172); ctx.lineTo(canvas.width, 172);
      ctx.stroke();
      ctx.setLineDash([]); // Resetear patrón de línea

      // Suavizar transición de movimiento de Baco entre carriles
      baco.targetY = lanes[baco.laneIndex];
      baco.currentY += (baco.targetY - baco.currentY) * 0.25;

      // --- Dibujar y Actualizar Baco 🐢 ---
      ctx.font = '26px monospace';
      ctx.fillText('🐢', baco.x - 12, baco.currentY + 9);

      // --- Generación de Pájaros por Carril ---
      // A medida que sube el nivel, aparecen más seguido (spawnRate más chico)
      let spawnInterval = Math.max(35, 75 - (level * 8));
      if (frameCount % spawnInterval === 0) {
        let randomLane = Math.floor(Math.random() * lanes.length);
        birds.push({
          x: canvas.width + 30,
          laneIndex: randomLane,
          y: lanes[randomLane],
          speed: baseSpeed + (level * 0.6) // ¡Cada nivel son más rápidos!
        });
      }

      // --- Actualizar y Dibujar Pájaros 🐦 ---
      for (let i = birds.length - 1; i >= 0; i--) {
        let bird = birds[i];
        bird.x -= bird.speed;
        
        ctx.fillText('🐦', bird.x - 12, bird.y + 9);

        // Detección de Colisión (Mismo carril y cercanía horizontal)
        if (
          baco.laneIndex === bird.laneIndex &&
          Math.abs(baco.x - bird.x) < 22
        ) {
          isGameOver = true;
          isPlaying = false;
          if (score > highScore) {
            highScore = score;
            localStorage.setItem('comebaco_lanes_highscore', highScore);
            recordVal.textContent = highScore;
          }
        }

        // Si el pájaro cruza la pantalla, suma puntos
        if (bird.x < -30) {
          birds.splice(i, 1);
          score += 10;
          scoreVal.textContent = score;

          // Dificultad progresiva: Cada 100 puntos sube de nivel
          let newLevel = Math.floor(score / 100) + 1;
          if (newLevel > level) {
            level = newLevel;
            levelVal.textContent = level;
          }
        }
      }

      if (!isGameOver) {
        requestAnimationFrame(loop);
      } else {
        drawGameOverScreen();
      }
    }

    function drawStartScreen() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 15px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('¡EL DESAFÍO DE LOS CARRILES!', canvas.width / 2, 90);
      
      ctx.fillStyle = '#f8fafc';
      ctx.font = '11px monospace';
      ctx.fillText('Usá ↑ ↓ para cambiar de carril', canvas.width / 2, 130);
      ctx.fillText('Cada 100 pts sube la dificultad', canvas.width / 2, 155);

      ctx.fillStyle = '#38bdf8';
      ctx.font = '10px monospace';
      ctx.fillText('TOCÁ PARA EMPEZAR', canvas.width / 2, 210);
      ctx.textAlign = 'left';
    }

    function drawGameOverScreen() {
      ctx.fillStyle = 'rgba(2, 6, 23, 0.88)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.textAlign = 'center';
      ctx.fillStyle = '#ef4444';
      ctx.font = 'bold 15px monospace';
      ctx.fillText('¡LOS PÁJAROS ATACARON A BACO!', canvas.width / 2, 90);

      ctx.fillStyle = '#f8fafc';
      ctx.font = '12px monospace';
      ctx.fillText(`Puntuación: ${score} | Nivel alcanzado: ${level}`, canvas.width / 2, 130);

      ctx.fillStyle = '#38bdf8';
      ctx.font = '11px monospace';
      ctx.fillText('Hacé clic o presioná ESPACIO para reintentar', canvas.width / 2, 180);
      ctx.textAlign = 'left';
    }

    drawStartScreen();
  </script>
</body>
</html>
